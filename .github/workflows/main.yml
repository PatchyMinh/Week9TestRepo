name: Multi-platform Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java-version: [17] # Bạn có thể thêm 11, 21 nếu muốn test rộng hơn
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Build and Test with Maven
      # Lưu ý: Nếu file pom.xml nằm trong Bai02/demo, hãy thêm -f Bai02/demo/pom.xml
      run: mvn -B package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4 # Cập nhật lên v4 cho ổn định
      with:
        name: bank-system-${{ matrix.os }}-java${{ matrix.java-version }}
        path: target/*.jar